<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevTasks - aplicació de gestió de tasques">
  <title>DevTasks</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>DevTasks</h1>
      <p>Gestor de tasques amb HTML, CSS i JavaScript</p>
    </div>
  </header>

  <main class="container">
    <section class="task-form-section">
      <h2>Nova tasca</h2>
      <form id="task-form">
        <label for="task-input">Descripció</label>
        <div class="form-row">
          <input id="task-input" type="text" placeholder="Escriu una tasca..." autocomplete="off">
          <button type="submit">Afegir</button>
        </div>
        <p id="form-error" class="error" aria-live="polite"></p>
      </form>
    </section>

    <section class="tasks-section">
      <div class="section-header">
        <h2>Les meves tasques</h2>
        <div class="filters">
          <button class="filter active" data-filter="all">Totes</button>
          <button class="filter" data-filter="pending">Pendents</button>
          <button class="filter" data-filter="completed">Completades</button>
        </div>
      </div>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty-message" class="empty-message">No hi ha tasques per mostrar.</p>
    </section>

    <section class="stats">
      <div class="stat"><span id="total-tasks">0</span><small>Total</small></div>
      <div class="stat"><span id="pending-tasks">0</span><small>Pendents</small></div>
      <div class="stat"><span id="completed-tasks">0</span><small>Completades</small></div>
    </section>
  </main>

  <footer class="footer">
    <p>Projecte DevOps · Desenvolupament Web</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
